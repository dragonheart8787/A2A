# spec:modules v1
# 模組邊界與允許變更類型。AI 僅能依此判斷「可動 / 不可動」。

modules:
  - name: "[module_name_1]"
    owner: core
    stability: stable   # experimental | beta | stable | deprecated
    path: "[src/...]"
    public_api:
      - "load_prices(symbols, start, end) -> DataFrame"
      # 僅列 public 介面；簽名變更視為 breaking。
    allowed_changes:
      - bugfix
      - perf
    allowed_rewrite: false

  - name: "[module_name_2]"
    owner: core
    stability: beta
    path: "[src/...]"
    public_api: []
    allowed_changes:
      - bugfix
      - perf
      - refactor
    allowed_rewrite: true   # 僅當符合 gate-diff 條件時

# 依賴與邊界（可與 architecture.md 對照）
dependency_allowlist: []   # 新增依賴時在此登記，並標註 approved: true/false
import_rules:
  - rule: no_cross_layer_import
    description: "禁止從上層模組 import 下層實作細節。"
  - rule: public_api_only_for_external
    description: "外部僅能依賴各模組 public_api 所列介面。"
